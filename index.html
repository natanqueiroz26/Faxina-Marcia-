<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Lançamentos - Nuvem</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --text-light: #6b7280;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 1.5rem; color: var(--primary); }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        input, select { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: var(--primary-dark); }
        .list-group { list-style: none; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #e5e7eb; }
        .list-item:last-child { border-bottom: none; }
        .item-info { flex-grow: 1; }
        .item-title { font-weight: 600; }
        .item-details { font-size: 0.85rem; color: var(--text-light); }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; color: white; }
        .badge-entrada { background: var(--success); }
        .badge-saida { background: var(--danger); }
        .btn-delete { background: var(--danger); width: auto; padding: 6px 12px; font-size: 0.8rem; margin-left: 10px; }
        .btn-delete:hover { background: #dc2626; }
        
        .btn-fab {
            display: none;
            width: 50px;
            height: 50px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            text-align: center;
            font-size: 28px;
            line-height: 48px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin: 0 auto 15px auto;
            border: none;
        }
        .btn-fab:hover { background: var(--primary-dark); }
        
        .auth-bar { text-align: right; margin-bottom: 15px; font-size: 0.85rem; }
        .auth-bar a { color: var(--primary); cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>📊 Meus Lançamentos</h1>
        <span id="syncStatus" class="badge badge-entrada">Conectado Nuvem</span>
    </header>

    <div class="auth-bar">
        <span id="authText">Modo Visualização Pública</span> | 
        <a id="authBtn" onclick="toggleAdmin()">Entrar como Administrador</a>
    </div>

    <!-- Botão de Mais (+) visível apenas para o Admin -->
    <button id="btnOpenForm" class="btn-fab" onclick="toggleForm()" title="Adicionar Lançamento">+</button>

    <!-- Formulário Restrito a Admin (Oculto por padrão) -->
    <div id="formCard" class="card" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3>Novo Lançamento</h3>
            <span style="cursor:pointer; font-weight:bold; color:#6b7280;" onclick="toggleForm()">✕ Fechar</span>
        </div>
        <form id="lancamentoForm">
            <div class="form-group">
                <label>Descrição</label>
                <input type="text" id="descricao" required placeholder="Ex: Faxina Residencial">
            </div>
            <div class="form-group">
                <label>Valor (R$)</label>
                <input type="number" step="0.01" id="valor" required placeholder="0.00">
            </div>
            <div class="form-group">
                <label>Tipo</label>
                <select id="tipo">
                    <option value="entrada">Entrada (Recebimento)</option>
                    <option value="saida">Saída (Despesa)</option>
                </select>
            </div>
            <button type="submit">Adicionar Lançamento</button>
        </form>
    </div>

    <!-- Lista Visível para Todos em Tempo Real -->
    <div class="card">
        <h3>Histórico em Tempo Real</h3>
        <ul id="listaLancamentos" class="list-group" style="margin-top: 15px;">
            <li class="list-item"><div class="item-info"><span class="item-details">Carregando dados da nuvem...</span></div></li>
        </ul>
    </div>
</div>

<!-- SDK do Firebase -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBhakcaNxs7mQCseq1QS9Eaq_",
        authDomain: "marcia-faxina.firebaseapp.com",
        projectId: "marcia-faxina",
        storageBucket: "marcia-faxina.firebasestorage.app",
        messagingSenderId: "753877272835",
        appId: "1:753877272835:web:7e80943e264d"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let isAdmin = false;
    const ADMIN_SENHA = "123";

    window.toggleAdmin = function() {
        if (!isAdmin) {
            let senha = prompt("Digite a senha de Administrador:");
            if (senha === ADMIN_SENHA) {
                isAdmin = true;
                document.getElementById('btnOpenForm').style.display = 'block';
                document.getElementById('authText').innerText = 'Modo Administrador Ativo';
                document.getElementById('authBtn').innerText = 'Sair do Modo Admin';
                carregarDados();
            } else if (senha !== null) {
                alert("Senha incorreta!");
            }
        } else {
            isAdmin = false;
            document.getElementById('btnOpenForm').style.display = 'none';
            document.getElementById('formCard').style.display = 'none';
            document.getElementById('authText').innerText = 'Modo Visualização Pública';
            document.getElementById('authBtn').innerText = 'Entrar como Administrador';
            carregarDados();
        }
    }

    window.toggleForm = function() {
        const form = document.getElementById('formCard');
        form.style.display = (form.style.display === 'none') ? 'block' : 'none';
    }

    async function migrarDadosLocais() {
        try {
            let dadosAntigos = localStorage.getItem('lancamentos');
            if (dadosAntigos) {
                let listaAntiga = JSON.parse(dadosAntigos);
                if (listaAntiga.length > 0) {
                    for (let item of listaAntiga) {
                        await addDoc(collection(db, "lancamentos"), {
                            descricao: item.descricao,
                            valor: Number(item.valor),
                            tipo: item.tipo,
                            data: item.data || new Date().toISOString()
                        });
                    }
                    localStorage.removeItem('lancamentos');
                }
            }
        } catch (e) {
            console.error("Erro ao migrar dados locais:", e);
        }
    }

    document.getElementById('lancamentoForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!isAdmin) return alert("Apenas o administrador pode adicionar lançamentos!");

        const descricao = document.getElementById('descricao').value;
        const valor = parseFloat(document.getElementById('valor').value);
        const tipo = document.getElementById('tipo').value;

        try {
            await addDoc(collection(db, "lancamentos"), {
                descricao,
                valor,
                tipo,
                data: new Date().toISOString()
            });
            document.getElementById('lancamentoForm').reset();
            document.getElementById('formCard').style.display = 'none';
        } catch (error) {
            alert("Erro ao salvar na nuvem: " + error.message);
        }
    });

    window.deletarLancamento = async function(id) {
        if (!isAdmin) return alert("Apenas o administrador pode apagar registros!");
        if (confirm("Tem certeza que deseja apagar este lançamento?")) {
            try {
                await deleteDoc(doc(db, "lancamentos", id));
            } catch (error) {
                alert("Erro ao deletar: " + error.message);
            }
        }
    }

    async function carregarDados() {
        await migrarDadosLocais();
        const q = query(collection(db, "lancamentos"));
        
        onSnapshot(q, (snapshot) => {
            const lista = document.getElementById('listaLancamentos');
            lista.innerHTML = "";

            if (snapshot.empty) {
                lista.innerHTML = `<li class="list-item"><div class="item-info"><span class="item-details">Nenhum lançamento cadastrado ainda.</span></div></li>`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const item = docSnap.data();
                const id = docSnap.id;
                
                let li = document.createElement('li');
                li.className = 'list-item';
                
                let deleteButtonHtml = isAdmin ? `<button class="btn-delete" onclick="deletarLancamento('${id}')">Excluir</button>` : '';
                
                li.innerHTML = `
                    <div class="item-info">
                        <div class="item-title">${item.descricao}</div>
                        <div class="item-details">R$ ${Number(item.valor).toFixed(2)}</div>
                    </div>
                    <div>
                        <span class="badge ${item.tipo === 'entrada' ? 'badge-entrada' : 'badge-saida'}">${item.tipo.toUpperCase()}</span>
                        ${deleteButtonHtml}
                    </div>
                `;
                lista.appendChild(li);
            });
        }, (error) => {
            console.error("Erro ao escutar dados:", error);
            document.getElementById('syncStatus').innerText = "Erro de Sincronização";
            document.getElementById('syncStatus').className = "badge badge-saida";
        });
    }

    carregarDados();
</script>

</body>
</html>
