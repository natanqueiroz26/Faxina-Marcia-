<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Faxinas - Nuvem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans pb-12">
    <!-- Cabeçalho -->
    <header class="bg-emerald-600 text-white shadow-md p-4 flex justify-between items-center relative">
        <button onclick="toggleMenu()" class="text-white p-2 cursor-pointer"><i class="fa-solid fa-bars text-xl"></i></button>
        <h1 class="text-lg font-bold"><i class="fa-solid fa-broom mr-2"></i>Faxinas Nuvem</h1>
        <div id="syncStatus" class="w-3 h-3 rounded-full bg-emerald-400"></div>
    </header>

    <!-- Drawer e Conteúdo (Mesma estrutura anterior, apenas focando no JS) -->
    <!-- [MANTIVE A ESTRUTURA VISUAL IGUAL PARA NÃO PERDER O LAYOUT] -->
    <div id="drawerOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden" onclick="toggleMenu()"></div>
    <div id="drawerMenu" class="fixed top-0 left-0 w-72 h-full bg-white shadow-2xl z-50 transform -translate-x-full transition-transform">
        <!-- ... (Menu interno igual) ... -->
    </div>

    <!-- O RESTO DO SEU HTML PERMANECE IGUAL. VAMOS AO SCRIPT FIREBASE -->

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBhakcaNxs7mQCseq1QS9Eaq_",
            authDomain: "marcia-faxina.firebaseapp.com",
            projectId: "marcia-faxina",
            storageBucket: "marcia-faxina.firebasestorage.app",
            messagingSenderId: "753877272835",
            appId: "1:753877272835:web:7e80943e264d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Variáveis globais de dados
        let faxinas = [];
        let casasValores = [];

        // Carregar dados em tempo real
        onSnapshot(query(collection(db, "faxinas"), orderBy("data", "desc")), (snapshot) => {
            faxinas = [];
            snapshot.forEach(doc => faxinas.push({ id: doc.id, ...doc.data() }));
            atualizarTela();
        });

        onSnapshot(collection(db, "casas"), (snapshot) => {
            casasValores = [];
            snapshot.forEach(doc => casasValores.push({ id: doc.id, ...doc.data() }));
        });

        // Funções de Ação (Substituindo o localStorage)
        window.salvarFaxina = async (novaFaxina) => {
            await addDoc(collection(db, "faxinas"), novaFaxina);
        };

        window.darBaixa = async (id) => {
            await updateDoc(doc(db, "faxinas", id), { status: 'recebido' });
        };

        window.removerFaxina = async (id) => {
            if(confirm('Apagar registro?')) await deleteDoc(doc(db, "faxinas", id));
        };

        // ... [As demais funções de lógica devem ser adaptadas para usar estas chamadas async] ...
        
        // Dica: Como agora é async, certifique-se de chamar 'await' nas funções de banco.
    </script>
</body>
</html>
